<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Chesed">
<meta name="theme-color" content="#000000">
<title>Chesed</title>
<style>
  :root{
    --bg:#000000;
    --surface:#110F0C;
    --surface-raised:#16130F;
    --border:#2E2822;
    --border-soft:#241F1A;
    --text:#EDE6D8;
    --muted:#948C7C;
    --muted-soft:#6E665A;
    --accent:#B99257;
    --accent-dim:#7A6440;
    --danger:#C77B5F;
    --radius-input:22px;
    --radius-box:18px;
    --radius-pill:999px;
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  }
  html, body{
    margin:0 !important;
    padding:0 !important;
    background:var(--bg) !important;
  }
  *{box-sizing:border-box;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .page{
    background:var(--bg);
    min-height:100vh;
    min-height:100dvh;
    width:100%;
    display:flex;
    flex-direction:column;
  }
  .wrap{
    flex:1 1 auto;
    display:flex;
    flex-direction:column;
    max-width:600px;
    width:100%;
    margin:0 auto;
    padding:44px 22px calc(24px + env(safe-area-inset-bottom));
    color:var(--text);
  }
  header{
    margin-bottom:28px;
  }
  .brand{
    font-family:var(--serif);
    font-size:32px;
    font-weight:400;
    letter-spacing:0.02em;
    color:var(--text);
    margin:0 0 8px;
  }
  .brand em{
    color:var(--accent);
    font-style:italic;
  }
  .sub{
    font-size:14.5px;
    color:var(--muted);
    line-height:1.55;
    margin:0;
    max-width:48ch;
  }

  /* Search field: rounded Apple-style input */
  form{
    display:flex;
    flex-direction:column;
    gap:14px;
    margin-bottom:8px;
  }
  .field{
    position:relative;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius-input);
    transition:border-color 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
  }
  .field:focus-within{
    border-color:var(--accent-dim);
    background:var(--surface-raised);
    box-shadow:0 0 0 4px rgba(185,146,87,0.10);
  }
  textarea{
    display:block;
    width:100%;
    background:transparent;
    border:none;
    color:var(--text);
    font-family:var(--serif);
    font-size:17px;
    line-height:1.5;
    padding:16px 20px;
    resize:none;
    min-height:60px;
  }
  textarea:focus{
    outline:none;
  }
  textarea::placeholder{
    color:var(--muted-soft);
  }
  .row-actions{
    display:flex;
    align-items:center;
    justify-content:flex-end;
    gap:10px;
  }
  .hint-inline{
    font-size:12.5px;
    color:var(--muted-soft);
    margin-right:auto;
  }
  .suggestions{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
  }
  .suggestion-chip{
    font-family:inherit;
    font-size:13px;
    color:#B0A890;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius-pill);
    padding:8px 16px;
    cursor:pointer;
    transition:border-color 0.15s ease, color 0.15s ease, transform 0.1s ease, background 0.15s ease;
  }
  .suggestion-chip:hover{
    border-color:var(--accent);
    color:var(--text);
  }
  .suggestion-chip:active{
    transform:scale(0.96);
  }
  .suggestion-chip[aria-pressed="true"]{
    border-color:var(--accent);
    color:var(--text);
    background:var(--surface-raised);
  }
  button{
    font-family:inherit;
    font-size:14px;
    cursor:pointer;
  }
  .btn-primary{
    background:var(--accent);
    color:#100E0C;
    border:none;
    padding:12px 26px;
    border-radius:var(--radius-pill);
    font-weight:600;
    letter-spacing:0.01em;
    transition:opacity 0.15s ease, transform 0.1s ease;
  }
  .btn-primary:hover{
    opacity:0.92;
  }
  .btn-primary:active{
    transform:translateY(1px) scale(0.98);
    opacity:0.85;
  }
  .btn-primary:disabled{
    opacity:0.55;
    cursor:default;
    transform:none;
  }
  .error-box{
    display:none;
    margin:28px 0 0;
    padding:15px 18px;
    border:1px solid var(--danger);
    border-radius:var(--radius-box);
    color:var(--danger);
    font-size:14px;
    line-height:1.5;
  }
  .error-box.visible{display:block;}

  .status-note{
    display:none;
    margin:28px 0 0;
    padding:13px 18px;
    border:1px solid var(--border);
    border-radius:var(--radius-box);
    color:var(--muted);
    font-size:13px;
    line-height:1.5;
  }
  .status-note.visible{display:block;}

  .results{
    margin-top:36px;
  }
  .results-heading{
    font-size:13px;
    color:var(--muted);
    margin:0 0 20px;
    line-height:1.5;
  }
  .group-heading{
    font-size:11.5px;
    text-transform:uppercase;
    letter-spacing:0.08em;
    color:var(--muted-soft);
    margin:34px 0 4px;
  }
  .group-heading:first-child{
    margin-top:0;
  }
  .verse-card{
    border-top:1px solid var(--border-soft);
    padding:24px 0;
  }
  .verse-card:last-child{
    border-bottom:1px solid var(--border-soft);
  }
  .verse-ref{
    margin:0 0 10px;
  }
  .verse-ref-text{
    font-family:var(--serif);
    font-style:italic;
    color:var(--accent);
    font-size:17px;
  }
  .verse-text{
    font-family:var(--serif);
    font-size:19px;
    line-height:1.65;
    color:var(--text);
    margin:0 0 12px;
  }
  .verse-why{
    font-size:13.5px;
    color:var(--muted);
    line-height:1.5;
    margin:0;
  }
  footer{
    margin-top:auto;
    padding-top:28px;
    border-top:1px solid var(--border-soft);
    text-align:center;
  }
  footer p{
    font-family:var(--serif);
    font-style:italic;
    font-size:15px;
    color:var(--accent-dim);
    line-height:1.6;
    margin:0;
  }

  /* Splash / tela inicial */
  .splash{
    position:fixed;
    inset:0;
    z-index:1000;
    background:var(--bg);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:32px 32px calc(32px + env(safe-area-inset-bottom));
    text-align:center;
    transition:opacity 0.4s ease;
  }
  .splash.is-hidden{
    opacity:0;
    pointer-events:none;
  }
  .splash-brand{
    font-family:var(--serif);
    font-size:34px;
    font-weight:400;
    letter-spacing:0.01em;
    color:var(--text);
    margin:0 0 34px;
  }
  .splash-brand em{
    color:var(--accent);
    font-style:italic;
  }
  .btn-abrir{
    background:var(--accent);
    color:#100E0C;
    border:none;
    padding:13px 40px;
    border-radius:var(--radius-pill);
    font-weight:600;
    font-size:14.5px;
    letter-spacing:0.02em;
    transition:opacity 0.15s ease, transform 0.1s ease;
  }
  .btn-abrir:active{
    transform:translateY(1px) scale(0.98);
    opacity:0.85;
  }
  .splash-footer{
    position:absolute;
    left:24px;
    right:24px;
    bottom:calc(36px + env(safe-area-inset-bottom));
    font-family:var(--serif);
    font-style:italic;
    font-size:12.5px;
    color:var(--muted-soft);
    line-height:1.6;
    margin:0;
  }
</style>
</head>
<body>
<div class="splash" id="splash">
  <p class="splash-brand">Ches<em>e</em>d</p>
  <button type="button" class="btn-abrir" id="abrir-btn">Abrir</button>
  <p class="splash-footer">Para Ju, meu amor, que você sempre ache a palavra que procura.</p>
</div>
<div class="page">
<div class="wrap">
  <header>
    <p class="brand">Ches<em>e</em>d</p>
    <p class="sub">Descreva um tema, cole um texto que você leu, ou digite uma referência. O buscador procura em toda a Bíblia e traz todas as passagens correspondentes.</p>
  </header>

  <form id="search-form">
    <div class="field">
      <textarea id="query" placeholder="Ele está em tudo, não tenha medo." rows="2" aria-label="Tema ou trecho para buscar"></textarea>
    </div>
    <div class="suggestions" id="suggestions"></div>
    <div class="row-actions">
      <button type="submit" class="btn-primary" id="submit-btn">Buscar</button>
    </div>
  </form>

  <div class="error-box" id="error-box"></div>
  <div class="status-note" id="status-note"></div>

  <div class="results" id="results"></div>

  <footer>
    <p>Para Ju, meu amor, que você sempre ache a palavra que procura.</p>
  </footer>
</div>
</div>

function normalize(str){
  return str
    .toLowerCase()
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g, '')
    .trim();
}

  'lucas':'lucas','lc':'lucas',
  'joao':'joao',
  'atos':'atos','at':'atos',
  'romanos':'romanos','rm':'romanos',
  '1 corintios':'1 corintios','1co':'1 corintios',
  '2 corintios':'2 corintios','2co':'2 corintios',
  'galatas':'galatas','gl':'galatas',
  'efesios':'efesios','ef':'efesios',
  'filipenses':'filipenses','fp':'filipenses',
  'colossenses':'colossenses','cl':'colossenses',
  '1 tessalonicenses':'1 tessalonicenses','1ts':'1 tessalonicenses',
  '2 tessalonicenses':'2 tessalonicenses','2ts':'2 tessalonicenses',
  '1 timoteo':'1 timoteo','1tm':'1 timoteo',
  '2 timoteo':'2 timoteo','2tm':'2 timoteo',
  'tito':'tito','tt':'tito',
  'filemom':'filemom','fm':'filemom',
  'hebreus':'hebreus','hb':'hebreus',
  'tiago':'tiago','tg':'tiago',
  '1 pedro':'1 pedro','1pe':'1 pedro',
  '2 pedro':'2 pedro','2pe':'2 pedro',
  '1 joao':'1 joao','1jo':'1 joao',
  '2 joao':'2 joao','2jo':'2 joao',
  '3 joao':'3 joao','3jo':'3 joao',
  'judas':'judas','jd':'judas',
  'apocalipse':'apocalipse','ap':'apocalipse'
};

function buildBookAliases(){
  BOOK_ALIASES = {};
  BIBLE.books.forEach((b, idx) => {
    BOOK_ALIASES[normalize(b.n)] = idx;
  });
  // Map extra aliases to canonical normalized name -> resolve to index
  Object.keys(EXTRA_ALIASES).forEach(alias => {
    const target = normalize(EXTRA_ALIASES[alias]);
    const idx = BOOK_ALIASES[target];
    if(idx !== undefined){
      BOOK_ALIASES[normalize(alias)] = idx;
    }
  });
  // "joao" alone is ambiguous with 1/2/3 João; default bare "joao" to the Gospel
  const gospelIdx = BOOK_ALIASES[normalize('joao')];
  if(gospelIdx === undefined){
    const idx = BIBLE.books.findIndex(b => normalize(b.n) === 'joao');
    if(idx !== -1) BOOK_ALIASES['joao'] = idx;
  }
}

function loadBible(){
  fetch('./bible.json')
    .then(r => r.json())
    .then(json => {
      BIBLE = json;
      buildBookAliases();
      BIBLE_READY = true;
      clearStatus();
    })
    .catch(() => {
      showStatus('Não foi possível carregar a Bíblia completa agora. A busca por temas continua funcionando normalmente.');
    });
}

function resolveBook(bookPartRaw){
  const bookPart = normalize(bookPartRaw).replace(/\s+/g,' ').trim();
  if(BOOK_ALIASES && BOOK_ALIASES[bookPart] !== undefined) return BOOK_ALIASES[bookPart];
  if(!BIBLE) return -1;
  // try prefix match against full book names (unique match only)
  const matches = [];
  BIBLE.books.forEach((b, idx) => {
    if(normalize(b.n).startsWith(bookPart) && bookPart.length >= 3){
      matches.push(idx);
    }
  });
  if(matches.length === 1) return matches[0];
  return -1;
}

// Parses strings like "João 3:16", "Salmos 23", "1 Coríntios 13:4-7"
function parseReference(rawQuery){
  if(!BIBLE_READY) return null;
  const norm = normalize(rawQuery).replace(/\s+/g,' ').trim();
  const m = norm.match(/^(.+?)\s+(\d{1,3})(?::\s?(\d{1,3})(?:\s?[-–]\s?(\d{1,3}))?)?$/);
  if(!m) return null;
  const bookIdx = resolveBook(m[1]);
  if(bookIdx === -1) return null;
  const chapterNum = parseInt(m[2], 10);
  const book = BIBLE.books[bookIdx];
  if(chapterNum < 1 || chapterNum > book.c.length) return null;
  const chapterVerses = book.c[chapterNum - 1];
  let verseStart = m[3] ? parseInt(m[3], 10) : 1;
  let verseEnd = m[4] ? parseInt(m[4], 10) : (m[3] ? verseStart : chapterVerses.length);
  if(verseStart < 1 || verseStart > chapterVerses.length) return null;
  verseEnd = Math.min(verseEnd, chapterVerses.length);
  const verses = [];
  for(let v = verseStart; v <= verseEnd; v++){
    verses.push({ num:v, text: chapterVerses[v-1] });
  }
  const label = book.n + ' ' + chapterNum + (m[3] ? (':' + verseStart + (verseEnd !== verseStart ? '-' + verseEnd : '')) : '');
  return { book: book.n, chapter: chapterNum, verses, label };
}

// Busca literal por palavra em TODA a Bíblia (todos os 66 livros)
function fullTextSearch(qWordsLong, excludeSet, limit){
  const results = [];
  if(!BIBLE_READY || !qWordsLong.length) return results;
  outer:
  for(let bi = 0; bi < BIBLE.books.length; bi++){
    const book = BIBLE.books[bi];
    for(let ci = 0; ci < book.c.length; ci++){
      const chapter = book.c[ci];
      for(let vi = 0; vi < chapter.length; vi++){
        const reference = book.n + ' ' + (ci+1) + ':' + (vi+1);
        if(excludeSet.has(reference)) continue;
        const text = chapter[vi];
        const haystack = normalize(text);
        if(qWordsLong.some(w => haystack.includes(w))){
          results.push({ reference, text });
          if(results.length >= limit) break outer;
        }
      }
    }
  }
  return results;
}


const queryEl = document.getElementById('query');
const form = document.getElementById('search-form');
const errorBox = document.getElementById('error-box');
const statusNote = document.getElementById('status-note');
const resultsEl = document.getElementById('results');
const suggestionsEl = document.getElementById('suggestions');

const SUGGESTIONS = ['Medo', 'Confiança', 'Proteção'];

function renderSuggestions(){
  suggestionsEl.innerHTML = '';
  SUGGESTIONS.forEach(label => {
    const chip = document.createElement('button');
    chip.type = 'button';
    chip.className = 'suggestion-chip';
    chip.textContent = label;
    chip.addEventListener('click', () => {
      queryEl.value = label;
      runSearch(label);
    });
    suggestionsEl.appendChild(chip);
  });
}
renderSuggestions();

function showError(message){
  errorBox.textContent = message;
  errorBox.classList.add('visible');
}
function clearError(){
  errorBox.classList.remove('visible');
  errorBox.textContent = '';
}
function clearStatus(){
  statusNote.classList.remove('visible');
  statusNote.textContent = '';
}
function showStatus(message){
  statusNote.textContent = message;
  statusNote.classList.add('visible');
}

function escapeRegex(str){
  return str.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
}

function allVerses(){
  const list = [];
  TOPICS.forEach(t => t.verses.forEach(v => list.push(v)));
  return list;
}

// Busca por tema: primeiro casa com os tópicos curados (que trazem a
// explicação do porquê), depois complementa com uma varredura literal em
// toda a Bíblia completa (quando já carregada) para não deixar de fora
// nenhuma ocorrência da palavra buscada em qualquer um dos 66 livros.
function search(rawQuery){
  const q = normalize(rawQuery);
  const qWords = q.split(/\s+/).filter(Boolean);
  const scored = TOPICS.map(topic => {
    let score = 0;
    topic.keywords.forEach(kw => {
      const nkw = normalize(kw);
      const wholeWord = new RegExp('(^|\\s)' + escapeRegex(nkw) + '(\\s|$)');
      if(wholeWord.test(q)){
        score += nkw.split(' ').length * 3;
      } else if(nkw.length >= 4 && qWords.some(w => w.length >= 4 && (nkw.includes(w) || w.includes(nkw)))){
        score += 1;
      }
    });
    return { topic, score };
  }).filter(s => s.score > 0)
    .sort((a,b) => b.score - a.score);

  const seen = new Set();
  const verses = [];
  scored.forEach(s => {
    s.topic.verses.forEach(v => {
      if(!seen.has(v.reference)){
        seen.add(v.reference);
        verses.push(v);
      }
    });
  });

  // Varredura literal no acervo curado primeiro (respostas com "porquê").
  const qWordsLong = qWords.filter(w => w.length >= 3);
  if(qWordsLong.length){
    allVerses().forEach(v => {
      if(seen.has(v.reference)) return;
      const haystack = normalize(v.text + ' ' + v.reference);
      if(qWordsLong.some(w => haystack.includes(w))){
        seen.add(v.reference);
        verses.push(v);
      }
    });
  }

  // Complementa com toda a Bíblia (66 livros), quando já carregada.
  const RESULT_CAP = 60;
  let moreAvailable = false;
  if(BIBLE_READY && qWordsLong.length && verses.length < RESULT_CAP){
    const extra = fullTextSearch(qWordsLong, seen, RESULT_CAP - verses.length + 1);
    if(extra.length > RESULT_CAP - verses.length){
      moreAvailable = true;
      extra.length = RESULT_CAP - verses.length;
    }
    extra.forEach(v => verses.push(v));
  }

  return { verses, moreAvailable };
}

function renderResults(passages, queryLabel, moreAvailable){
  resultsEl.innerHTML = '';
  if(!passages.length){
    resultsEl.innerHTML = '<p class="results-heading">Nenhuma passagem encontrada para esse tema ainda. Tente palavras como ansiedade, perdão, medo, confiança, proteção, propósito, casamento, dinheiro, fé, cura, força, oração — ou digite uma referência como "João 3:16".</p>';
    return;
  }
  const heading = document.createElement('p');
  heading.className = 'results-heading';
  heading.textContent = passages.length + (passages.length === 1 ? ' versículo encontrado' : ' versículos encontrados') + (queryLabel ? ' sobre "' + queryLabel + '"' : '');
  resultsEl.appendChild(heading);

  passages.forEach(p => {
    const card = document.createElement('div');
    card.className = 'verse-card';

    const ref = document.createElement('div');
    ref.className = 'verse-ref';
    ref.innerHTML = '<span class="verse-ref-text">' + p.reference + '</span>';

    const verseText = document.createElement('p');
    verseText.className = 'verse-text';
    verseText.textContent = p.text;

    card.appendChild(ref);
    card.appendChild(verseText);

    if(p.why){
      const why = document.createElement('p');
      why.className = 'verse-why';
      why.textContent = p.why;
      card.appendChild(why);
    }
    resultsEl.appendChild(card);
  });

  if(moreAvailable){
    const more = document.createElement('p');
    more.className = 'results-heading';
    more.style.marginTop = '20px';
    more.textContent = 'Há mais ocorrências na Bíblia para esse termo. Tente uma palavra mais específica para refinar.';
    resultsEl.appendChild(more);
  }
}

// Exibe uma referência direta (capítulo, versículo ou intervalo) como uma
// passagem corrida, com os números de versículo destacados inline.
function renderReferencePassage(ref){
  resultsEl.innerHTML = '';
  const heading = document.createElement('p');
  heading.className = 'group-heading';
  heading.textContent = ref.label;
  resultsEl.appendChild(heading);

  const card = document.createElement('div');
  card.className = 'verse-card';
  const passage = document.createElement('p');
  passage.className = 'verse-text';
  ref.verses.forEach(v => {
    const supEl = document.createElement('sup');
    supEl.textContent = ' ' + v.num + ' ';
    supEl.style.color = 'var(--accent)';
    supEl.style.fontStyle = 'normal';
    passage.appendChild(supEl);
    passage.appendChild(document.createTextNode(v.text + ' '));
  });
  card.appendChild(passage);
  resultsEl.appendChild(card);
}

function runSearch(rawQuery){
  const q = rawQuery.trim();
  if(!q){
    showError('Digite um tema, uma referência ou palavra para buscar.');
    return;
  }
  clearError();
  clearStatus();

  const ref = parseReference(q);
  if(ref){
    renderReferencePassage(ref);
    resultsEl.scrollIntoView({ behavior:'smooth', block:'start' });
    return;
  }

  const { verses, moreAvailable } = search(q);
  renderResults(verses, q, moreAvailable);
  resultsEl.scrollIntoView({ behavior:'smooth', block:'start' });
}

// Versículo do dia: preenche a tela antes de qualquer busca, para a página
// inicial não ficar vazia. Escolha determinística pela data, sem precisar
// de internet nem de sorteio a cada visita.
function renderDailyVerse(){
  const list = allVerses();
  const startOfYear = new Date(new Date().getFullYear(), 0, 0);
  const diff = new Date() - startOfYear;
  const dayOfYear = Math.floor(diff / 86400000);
  const v = list[dayOfYear % list.length];

  resultsEl.innerHTML = '';
  const h = document.createElement('p');
  h.className = 'group-heading';
  h.textContent = 'Versículo de hoje';
  resultsEl.appendChild(h);

  const card = document.createElement('div');
  card.className = 'verse-card';
  const ref = document.createElement('div');
  ref.className = 'verse-ref';
  ref.innerHTML = '<span class="verse-ref-text">' + v.reference + '</span>';
  const verseText = document.createElement('p');
  verseText.className = 'verse-text';
  verseText.textContent = v.text;
  card.appendChild(ref);
  card.appendChild(verseText);
  if(v.why){
    const why = document.createElement('p');
    why.className = 'verse-why';
    why.textContent = v.why;
    card.appendChild(why);
  }
  resultsEl.appendChild(card);
}
renderDailyVerse();
showStatus('Carregando a Bíblia completa para busca offline…');
loadBible();

form.addEventListener('submit', (e) => {
  e.preventDefault();
  runSearch(queryEl.value);
});

const abrirBtn = document.getElementById('abrir-btn');
if(abrirBtn && splashEl){
  abrirBtn.addEventListener('click', () => {
    splashEl.classList.add('is-hidden');
    setTimeout(() => { splashEl.style.display = 'none'; }, 450);
  });
}

if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
